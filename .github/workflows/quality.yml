name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: levelup
          POSTGRES_PASSWORD: levelup
          POSTGRES_DB: levelup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U levelup -d levelup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://levelup:levelup@localhost:5432/levelup?schema=public
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001
      API_URL: http://localhost:4000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: levelup-local
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: change-me-now
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_FROM: LevelUp <no-reply@levelup.local>
      SESSION_SECRET: ci-session-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install browser dependencies
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
